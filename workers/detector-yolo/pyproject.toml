[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ainvr-detector-yolo"
version = "0.0.1"
description = "AI-NVR YOLO Detection Worker"
requires-python = ">=3.9"
authors = [
    {name = "AI-NVR Platform"},
]
dependencies = []

[project.scripts]
ainvr-detector-yolo = "ainvr_detector_yolo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ainvr_detector_yolo"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

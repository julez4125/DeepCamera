name: Security Hardening

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/security-hardening.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/security-hardening.yml'

jobs:
  guardrails:
    name: Image, config, and secret guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate bash scripts
        run: bash -n infra/scripts/init-minio.sh infra/scripts/security-hardening-check.sh

      - name: Run hardening checks
        run: bash infra/scripts/security-hardening-check.sh
